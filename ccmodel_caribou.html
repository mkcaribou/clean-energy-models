<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean cooking financial impact model — Caribou</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Public Sans', system-ui, sans-serif;
            background: #ffffff;
            font-size: 15px;
            color: #1e1e1e;
        }
        input[type="range"] {
            width: 100%;
            height: 5px;
            background: #e5e7eb;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #fff;
            border: 3px solid #4A334E;
            border-radius: 50%;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #fff;
            border: 3px solid #4A334E;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Brand accent tokens — used for UI chrome only, not body text
        const B = {
            hazyPlum:    '#4A334E',
            stonePlum:   '#604D64',
            pebble:      '#E8E6E9',
            mint:        '#6DC695',
            springGreen: '#B6D3B6',
            fuschia:     '#BC9BCE',
            naranja:     '#FFA31D',
            lavender:    '#9278DD',
            clover:      '#287F66',
            red:         '#C0392B',
        };

        function StoveStackingWidget() {
          const [paymentMethod, setPaymentMethod] = useState('upfront');
          const [depositPercent, setDepositPercent] = useState(20);
          const [loanTermYears, setLoanTermYears] = useState(2);
          const [annualInterestRate, setAnnualInterestRate] = useState(30);
          const [paygTermYears, setPaygTermYears] = useState(2);
          const [paygPremiumPercent, setPaygPremiumPercent] = useState(70);
          const [monthlyHouseholdIncome, setMonthlyHouseholdIncome] = useState(80);
          const [baselineFuelCost, setBaselineFuelCost] = useState(140);
          const [stacking, setStacking] = useState(50);
          const [timeReallocationPct, setTimeReallocationPct] = useState(0);
          const [wageRate, setWageRate] = useState(0.27);
          const [baselineFuelCollection, setBaselineFuelCollection] = useState(1.5);
          const [baselineCookingTime, setBaselineCookingTime] = useState(4.8);
          const [icsCapitalBase, setIcsCapitalBase] = useState(25);
          const [lpgCapitalBase, setLpgCapitalBase] = useState(50);
          const [solarCapitalBase, setSolarCapitalBase] = useState(650);
          const [lpgAnnualFuelCost, setLpgAnnualFuelCost] = useState(73);

          const technologies = {
            ics: {
              name: "Improved Cookstoves",
              capitalCost: icsCapitalBase,
              lifespan: 5,
              fuelType: 'fraction',
              fuelReduction: 0.35,
              fuelCollectionReduction: 0.35,
              cookingTimeReduction: 0.15,
              pm25Reduction: 0.40,
              dalys: 0.02,
              description: "Efficient, durable biomass stove (e.g., Jikokoa) with improved combustion chamber that reduces fuel use by 35% vs. traditional 3-stone fire."
            },
            lpg: {
              name: "LPG",
              capitalCost: lpgCapitalBase,
              lifespan: 10,
              fuelType: 'absolute',
              newFuelCost: lpgAnnualFuelCost,
              fuelCollectionReduction: 0.70,
              cookingTimeReduction: 0.25,
              pm25Reduction: 0.85,
              dalys: 0.13,
              description: "Single-burner LPG stove with 6kg cylinder. Clean-burning gas eliminates smoke and reduces cooking time. Supply chains need to be reliable."
            },
            solar: {
              name: "Solar E-Cooking",
              capitalCost: solarCapitalBase,
              lifespan: 7,
              fuelType: 'absolute',
              newFuelCost: 0,
              fuelCollectionReduction: 0.80,
              cookingTimeReduction: 0.25,
              pm25Reduction: 0.95,
              dalys: 0.138,
              description: "Solar Home System (4-panel, ~200W) with Electric Pressure Cooker. Zero emissions, fast cooking, but requires reliable supply chain."
            }
          };

          const calculateFinancingDetails = (tech) => {
            const baseCost = technologies[tech].capitalCost;
            const lifespan = technologies[tech].lifespan;
            if (paymentMethod === 'upfront') {
              return { totalCost: baseCost, depositRequired: baseCost, monthlyPayment: 0, totalInterest: 0, effectiveAnnualCost: baseCost / lifespan, description: 'Full payment upfront' };
            }
            if (paymentMethod === 'financing') {
              const deposit = baseCost * (depositPercent / 100);
              const principal = baseCost - deposit;
              const monthlyRate = annualInterestRate / 100 / 12;
              const numPayments = loanTermYears * 12;
              let monthlyPayment = 0;
              if (monthlyRate > 0 && numPayments > 0) {
                monthlyPayment = principal * (monthlyRate * Math.pow(1 + monthlyRate, numPayments)) / (Math.pow(1 + monthlyRate, numPayments) - 1);
              } else {
                monthlyPayment = principal / numPayments;
              }
              const totalPaid = deposit + (monthlyPayment * numPayments);
              return { totalCost: totalPaid, depositRequired: deposit, monthlyPayment, totalInterest: totalPaid - baseCost, effectiveAnnualCost: totalPaid / lifespan, description: `${depositPercent}% deposit + ${loanTermYears}-year loan at ${annualInterestRate}% APR` };
            }
            const totalCost = baseCost * (1 + paygPremiumPercent / 100);
            const monthlyPayment = totalCost / (paygTermYears * 12);
            return { totalCost, depositRequired: 0, monthlyPayment, totalInterest: totalCost - baseCost, effectiveAnnualCost: totalCost / technologies[tech].lifespan, description: `Lease-to-own over ${paygTermYears} years, ${paygPremiumPercent}% total premium` };
          };

          const checkAffordability = (monthlyPayment, depositRequired, techName, totalCost) => {
            const issues = [];
            if (paymentMethod === 'upfront') {
              const m = totalCost / monthlyHouseholdIncome;
              if (m > 3)   issues.push({ severity: 'error',   message: `${techName}: Upfront cost ($${Math.round(totalCost)}) exceeds 3 months income. Requires subsidies or financing.` });
              else if (m > 1.5) issues.push({ severity: 'warning', message: `${techName}: Upfront cost ($${Math.round(totalCost)}) exceeds 1.5 months income. Major access barrier.` });
            } else {
              const ratio = (monthlyPayment / monthlyHouseholdIncome) * 100;
              if (ratio > 15)  issues.push({ severity: 'error',   message: `${techName}: Monthly payment (${ratio.toFixed(0)}% of income) exceeds threshold of 15%. High default risk.` });
              else if (ratio > 10) issues.push({ severity: 'warning', message: `${techName}: Monthly payment (${ratio.toFixed(0)}% of income) is moderately high. May strain household budget.` });
              if (paymentMethod === 'financing' && depositRequired > 0) {
                if (depositRequired > monthlyHouseholdIncome * 1.5)  issues.push({ severity: 'error',   message: `${techName}: Deposit ($${Math.round(depositRequired)}) exceeds 1.5 months income. Major access barrier.` });
                else if (depositRequired > monthlyHouseholdIncome * 0.5) issues.push({ severity: 'warning', message: `${techName}: Deposit ($${Math.round(depositRequired)}) exceeds half a month's income. May require subsidies or financing.` });
              }
            }
            return { issues };
          };

          const icsF   = calculateFinancingDetails('ics');
          const lpgF   = calculateFinancingDetails('lpg');
          const solarF = calculateFinancingDetails('solar');

          const icsA   = checkAffordability(icsF.monthlyPayment,   icsF.depositRequired,   'ICS',   icsF.totalCost);
          const lpgA   = checkAffordability(lpgF.monthlyPayment,   lpgF.depositRequired,   'LPG',   lpgF.totalCost);
          const solarA = checkAffordability(solarF.monthlyPayment, solarF.depositRequired, 'Solar', solarF.totalCost);

          const allIssues = [...icsA.issues, ...lpgA.issues, ...solarA.issues];

          const icsCapital   = icsF.effectiveAnnualCost;
          const lpgCapital   = lpgF.effectiveAnnualCost;
          const solarCapital = solarF.effectiveAnnualCost;

          const calculateFuelCost = (tech) => {
            const spec = technologies[tech];
            const mod = (100 - stacking) / 100;
            const trad = stacking / 100;
            if (spec.fuelType === 'fraction') {
              return (mod * baselineFuelCost * (1 - spec.fuelReduction)) + (trad * baselineFuelCost);
            }
            return (mod * spec.newFuelCost) + (trad * baselineFuelCost);
          };

          const calculateTimeValue = (cr, cook) => {
            const adopt = (100 - stacking) / 100;
            const hrs = ((baselineFuelCollection * cr) + (baselineCookingTime * cook)) * adopt * 365;
            return hrs * (timeReallocationPct / 100) * wageRate;
          };

          const calcHours = (cr, cook) => {
            const adopt = (100 - stacking) / 100;
            return ((baselineFuelCollection * cr) + (baselineCookingTime * cook)) * adopt * 365;
          };

          const icsFuel   = calculateFuelCost('ics');
          const lpgFuel   = calculateFuelCost('lpg');
          const solarFuel = calculateFuelCost('solar');

          const icsTime   = calculateTimeValue(technologies.ics.fuelCollectionReduction,   technologies.ics.cookingTimeReduction);
          const lpgTime   = calculateTimeValue(technologies.lpg.fuelCollectionReduction,   technologies.lpg.cookingTimeReduction);
          const solarTime = calculateTimeValue(technologies.solar.fuelCollectionReduction, technologies.solar.cookingTimeReduction);

          const icsHours   = calcHours(technologies.ics.fuelCollectionReduction,   technologies.ics.cookingTimeReduction);
          const lpgHours   = calcHours(technologies.lpg.fuelCollectionReduction,   technologies.lpg.cookingTimeReduction);
          const solarHours = calcHours(technologies.solar.fuelCollectionReduction, technologies.solar.cookingTimeReduction);

          const icsSav   = baselineFuelCost - icsFuel;
          const lpgSav   = baselineFuelCost - lpgFuel;
          const solarSav = baselineFuelCost - solarFuel;

          const icsNet   = icsSav   + icsTime   - icsCapital;
          const lpgNet   = lpgSav   + lpgTime   - lpgCapital;
          const solarNet = solarSav + solarTime - solarCapital;

          const icsROI   = icsCapital   > 0 ? (icsNet   / icsCapital)   * 100 : 0;
          const lpgROI   = lpgCapital   > 0 ? (lpgNet   / lpgCapital)   * 100 : 0;
          const solarROI = solarCapital > 0 ? (solarNet / solarCapital) * 100 : 0;

          const icsPayback   = icsNet   > 0 ? technologies.ics.capitalCost   / icsNet   : null;
          const lpgPayback   = lpgNet   > 0 ? technologies.lpg.capitalCost   / lpgNet   : null;
          const solarPayback = solarNet > 0 ? technologies.solar.capitalCost / solarNet : null;

          const getVerdict = (net, roi, payback) => {
            if (net < 0) return { icon: '⛔', label: 'Negative return', summary: `Costs exceed benefits by $${Math.abs(Math.round(net))}/year`, color: B.red, bg: '#fee2e2', border: '#fecaca' };
            if (roi > 100 && payback && payback < 2) return { icon: '✓✓', label: 'Excellent investment', summary: `${Math.round(roi)}% ROI, pays back in ${payback.toFixed(1)} years`, color: '#15803d', bg: '#dcfce7', border: '#bbf7d0' };
            if (roi > 50) return { icon: '✓', label: 'Good investment', summary: `${Math.round(roi)}% ROI${payback ? `, pays back in ${payback.toFixed(1)} years` : ''}`, color: '#16a34a', bg: '#dcfce7', border: '#bbf7d0' };
            if (roi > 0)  return { icon: '○', label: 'Marginal return', summary: `${Math.round(roi)}% ROI — positive but modest`, color: '#d97706', bg: '#fef3c7', border: '#fde68a' };
            return { icon: '○', label: 'Near break-even', summary: 'Benefits roughly equal costs', color: '#6b7280', bg: '#f3f4f6', border: '#e5e7eb' };
          };

          const icsV   = getVerdict(icsNet,   icsROI,   icsPayback);
          const lpgV   = getVerdict(lpgNet,   lpgROI,   lpgPayback);
          const solarV = getVerdict(solarNet, solarROI, solarPayback);

          // Waterfall chart
          const WaterfallChart = ({ fuelSavings, timeValue, capitalCost, netBenefit }) => {
            const maxVal = Math.max(...[fuelSavings, timeValue, netBenefit].map(v => Math.abs(v)), capitalCost, 1) * 1.2;
            const H = 80, zero = 40, scale = 40 / maxVal, bw = 50, gap = 14;
            const renderBar = (val, color, label, x, bLabel) => {
              const h = Math.max(Math.abs(val * scale), 2);
              const top = val >= 0 ? zero - h : zero;
              return (
                <div style={{ position: 'absolute', left: `${x}px` }}>
                  <div style={{ width: `${bw}px`, height: `${h}px`, position: 'absolute', top: `${top}px`, background: color }}>
                    <div style={{ color: h > 16 ? 'white' : color, fontSize: '11px', fontWeight: '700', textAlign: 'center', position: h > 16 ? 'relative' : 'absolute', top: h > 16 ? '2px' : (val >= 0 ? '-15px' : `${h + 2}px`), width: '100%' }}>{label}</div>
                  </div>
                  <div style={{ fontSize: '11px', textAlign: 'center', width: `${bw}px`, position: 'absolute', top: `${H + 4}px`, color: '#6b7280', fontWeight: '500' }}>{bLabel}</div>
                </div>
              );
            };
            return (
              <div style={{ display: 'flex', justifyContent: 'center' }}>
                <div style={{ position: 'relative', width: `${bw * 4 + gap * 3}px`, height: `${H + 22}px` }}>
                  <div style={{ position: 'absolute', width: '100%', borderTop: '1px solid #9ca3af', top: `${zero}px` }} />
                  {renderBar(-capitalCost, B.fuschia,     `-$${Math.round(capitalCost)}`,                                              0,             'Capital')}
                  {renderBar(fuelSavings,  fuelSavings >= 0 ? B.mint : B.red, `${fuelSavings >= 0 ? '+' : ''}$${Math.round(fuelSavings)}`, bw + gap,      'Fuel')}
                  {renderBar(timeValue,    B.springGreen, `+$${Math.round(timeValue)}`,                                               (bw+gap)*2,    'Time')}
                  {renderBar(netBenefit,   netBenefit >= 0 ? B.clover : B.red, `${netBenefit >= 0 ? '+' : ''}$${Math.round(netBenefit)}`, (bw+gap)*3,    'Net')}
                </div>
              </div>
            );
          };

          // Slider
          const SliderControl = ({ label, value, onChange, min, max, step = 1, unit = "", helpText = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
              if (ref.current) {
                const pct = ((value - min) / (max - min)) * 100;
                ref.current.style.background = `linear-gradient(to right, ${B.hazyPlum} 0%, ${B.hazyPlum} ${pct}%, #e5e7eb ${pct}%, #e5e7eb 100%)`;
              }
            }, [value, min, max]);
            return (
              <div style={{ marginBottom: '16px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}>
                  <label style={{ fontSize: '14px', fontWeight: '500', color: '#374151' }}>{label}</label>
                  <span style={{ fontSize: '14px', fontWeight: '600', color: '#111827' }}>{value}{unit}</span>
                </div>
                {helpText && <div style={{ fontSize: '13px', color: '#6b7280', marginBottom: '6px' }}>{helpText}</div>}
                <input ref={ref} type="range" min={min} max={max} step={step} value={value} onChange={e => onChange(parseFloat(e.target.value))} />
              </div>
            );
          };

          const getLabel = (t) => stacking === 0 ? `100% ${t}` : stacking === 100 ? `0% ${t}` : `${100 - stacking}% ${t}`;

          // Outcome card
          const OutcomeCard = ({ tech, techKey, financing, fuelSavings, timeValue, totalHours, capital, netBenefit, roi, payback, verdict }) => {
            const colors = { ics: B.mint, lpg: B.naranja, solar: B.lavender };
            const col = colors[techKey];
            return (
              <div style={{ padding: '18px', background: 'white', border: `3px solid ${col}` }}>
                <div style={{ marginBottom: '14px', paddingBottom: '12px', borderBottom: `2px solid ${col}` }}>
                  <div style={{ fontWeight: '700', fontSize: '17px', color: '#1f2937', marginBottom: '4px' }}>{tech.name}</div>
                  <div style={{ fontSize: '13px', color: '#6b7280' }}>{tech.description}</div>
                </div>
                <div style={{ padding: '12px', background: verdict.bg, border: `2px solid ${verdict.border}`, marginBottom: '14px', textAlign: 'center' }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', fontSize: '16px', fontWeight: '700', color: verdict.color, marginBottom: '4px' }}>
                    <span>{verdict.icon}</span><span>{verdict.label}</span>
                  </div>
                  <div style={{ fontSize: '13px', color: verdict.color }}>{verdict.summary}</div>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '14px' }}>
                  <div style={{ background: '#f9fafb', padding: '10px', textAlign: 'center' }}>
                    <div style={{ fontSize: '12px', color: '#6b7280', marginBottom: '4px' }}>Net annual benefit</div>
                    <div style={{ fontSize: '22px', fontWeight: '700', color: netBenefit >= 0 ? '#15803d' : B.red }}>{netBenefit >= 0 ? '+' : ''}${Math.round(netBenefit)}</div>
                  </div>
                  <div style={{ background: '#f9fafb', padding: '10px', textAlign: 'center' }}>
                    <div style={{ fontSize: '12px', color: '#6b7280', marginBottom: '4px' }}>ROI</div>
                    <div style={{ fontSize: '22px', fontWeight: '700', color: roi >= 0 ? '#15803d' : B.red }}>{Math.round(roi)}%</div>
                  </div>
                </div>
                <div style={{ marginBottom: '14px', padding: '12px', background: '#f9fafb' }}>
                  <div style={{ fontSize: '12px', color: '#6b7280', textAlign: 'center', marginBottom: '6px' }}>Annual economics breakdown</div>
                  <WaterfallChart fuelSavings={fuelSavings} timeValue={timeValue} capitalCost={capital} netBenefit={netBenefit} />
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                  <div style={{ fontSize: '13px', padding: '12px', background: '#f0fdf4' }}>
                    <div style={{ fontWeight: '600', color: '#166534', marginBottom: '6px' }}>Annual benefits</div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '3px' }}>
                      <span>Fuel savings:</span><span style={{ fontWeight: '500', color: fuelSavings >= 0 ? '#166534' : B.red }}>{fuelSavings >= 0 ? '+' : ''}${Math.round(fuelSavings)}</span>
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <span>Time value:</span><span style={{ fontWeight: '500', color: '#166534' }}>+${Math.round(timeValue)}</span>
                    </div>
                  </div>
                  <div style={{ fontSize: '13px', padding: '12px', background: '#fef2f2' }}>
                    <div style={{ fontWeight: '600', color: '#991b1b', marginBottom: '6px' }}>Annual costs</div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '3px' }}>
                      <span>Capital cost:</span><span style={{ fontWeight: '500' }}>${Math.round(capital)}</span>
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <span>Total paid:</span><span style={{ fontWeight: '500' }}>${Math.round(financing.totalCost)}</span>
                    </div>
                  </div>
                </div>
                <div style={{ marginTop: '12px', padding: '10px', background: '#f9fafb', fontSize: '13px', color: '#4b5563' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}>
                    <span>Hours saved per year:</span><span style={{ fontWeight: '600' }}>{Math.round(totalHours)} hrs</span>
                  </div>
                  {payback && (
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <span>Payback period:</span><span style={{ fontWeight: '600', color: '#15803d' }}>{payback.toFixed(1)} years</span>
                    </div>
                  )}
                </div>
              </div>
            );
          };

          const btnStyle = (active) => ({
            flex: 1, padding: '10px 14px', fontSize: '14px', cursor: 'pointer',
            border: `2px solid ${B.hazyPlum}`,
            background: active ? B.hazyPlum : 'white',
            color: active ? 'white' : '#374151',
            fontWeight: '500',
            fontFamily: "'Public Sans', system-ui, sans-serif"
          });

          return (
            <div style={{ maxWidth: '1200px', margin: '0 auto', padding: '24px', background: 'white' }}>

              {/* Header */}
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
                <div style={{ display: 'flex', alignItems: 'flex-end', gap: '16px' }}>
                  <img src="Caribou_Logo_Primary_Black.png" alt="Caribou" style={{ height: '28px', flexShrink: 0 }} />
                  <h1 style={{ fontFamily: "'Crimson Text', Georgia, serif", fontSize: '32px', fontWeight: '400', color: '#1e1e1e', lineHeight: '.65', margin: 0 }}>
                    Clean cooking financial impact model
                  </h1>
                </div>
                <div style={{ textAlign: 'right', flexShrink: 0, marginLeft: '24px' }}>
                  <div style={{ fontSize: '11px', color: '#9ca3af', marginBottom: '6px', textTransform: 'uppercase', letterSpacing: '0.04em' }}>Produced with support from</div>
                  <div style={{ display: 'flex', gap: '12px', alignItems: 'center', justifyContent: 'flex-end' }}>
                    <img src="../Caribou Logos/Shell_Foundation_Logo.jpg" alt="Shell Foundation" style={{ height: '26px' }} />
                    <img src="../Caribou Logos/UKaid.png" alt="UKaid" style={{ height: '32px' }} />
                  </div>
                </div>
              </div>

              {/* Instructions — dark purple, sharp corners */}
              <div style={{ padding: '16px 20px', background: B.hazyPlum, marginBottom: '20px', fontSize: '15px', color: 'white', lineHeight: '1.6' }}>
                <p style={{ marginBottom: '10px' }}>
                  <strong>What this model does:</strong> Estimates the annual economic return of clean cooking technologies for low-income households. It compares fuel costs, time savings, and capital costs to calculate net benefit, ROI, and payback period.
                </p>
                <p>
                  <strong>How to use it:</strong> Set baseline fuel costs and time burdens to reflect current household conditions. Choose a payment method and adjust financing terms. The "stove stacking" slider accounts for continued use of traditional stoves alongside modern alternatives.
                </p>
              </div>

              {/* Technology costs */}
              <div style={{ padding: '20px', background: '#f9fafb', border: '1px solid #e5e7eb', marginBottom: '20px' }}>
                <h3 style={{ fontSize: '16px', fontWeight: '600', marginBottom: '16px', color: '#1e1e1e' }}>Technology costs</h3>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '20px' }}>
                  <div>
                    <div style={{ fontWeight: '600', marginBottom: '6px', color: '#1e1e1e', fontSize: '15px' }}>Improved Cookstoves (ICS)</div>
                    <div style={{ color: '#4b5563', marginBottom: '12px', lineHeight: '1.5', fontSize: '13px' }}>{technologies.ics.description}</div>
                    <SliderControl label="Capital cost" value={icsCapitalBase} onChange={setIcsCapitalBase} min={15} max={40} step={1} unit=" USD" helpText="Lifespan: 5 years" />
                  </div>
                  <div>
                    <div style={{ fontWeight: '600', marginBottom: '6px', color: '#1e1e1e', fontSize: '15px' }}>LPG</div>
                    <div style={{ color: '#4b5563', marginBottom: '12px', lineHeight: '1.5', fontSize: '13px' }}>{technologies.lpg.description}</div>
                    <SliderControl label="Capital cost" value={lpgCapitalBase} onChange={setLpgCapitalBase} min={30} max={80} step={1} unit=" USD" helpText="Lifespan: 10 years" />
                    <SliderControl label="Annual LPG fuel cost" value={lpgAnnualFuelCost} onChange={setLpgAnnualFuelCost} min={40} max={150} step={5} unit=" USD/yr" helpText="Varies by location: Kenya ~$70, Uganda ~$90" />
                  </div>
                  <div>
                    <div style={{ fontWeight: '600', marginBottom: '6px', color: '#1e1e1e', fontSize: '15px' }}>Solar E-Cooking</div>
                    <div style={{ color: '#4b5563', marginBottom: '12px', lineHeight: '1.5', fontSize: '13px' }}>{technologies.solar.description}</div>
                    <SliderControl label="Capital cost" value={solarCapitalBase} onChange={setSolarCapitalBase} min={400} max={900} step={10} unit=" USD" helpText="Lifespan: 7 years" />
                  </div>
                </div>
              </div>

              {/* Payment method — light plum, brand-aligned */}
              <div style={{ padding: '20px', background: '#f5f0f6', border: '2px solid #d4c2d8', marginBottom: '20px' }}>
                <h3 style={{ fontSize: '16px', fontWeight: '600', marginBottom: '16px', color: B.hazyPlum }}>Payment method and financing</h3>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px' }}>
                  <div>
                    <div style={{ display: 'flex', gap: '10px', marginBottom: '16px' }}>
                      <button onClick={() => setPaymentMethod('upfront')}   style={btnStyle(paymentMethod === 'upfront')}>Cash upfront</button>
                      <button onClick={() => setPaymentMethod('financing')} style={btnStyle(paymentMethod === 'financing')}>Consumer loan</button>
                      <button onClick={() => setPaymentMethod('payg')}      style={btnStyle(paymentMethod === 'payg')}>PAYG (lease-to-own)</button>
                    </div>

                    {paymentMethod === 'financing' && (
                      <div style={{ padding: '16px', background: 'white', border: '1px solid #e5e7eb' }}>
                        <SliderControl label="Deposit requirement" value={depositPercent} onChange={setDepositPercent} min={0} max={50} step={5} unit="%" helpText="Most MFIs require 10-30% upfront" />
                        <SliderControl label="Loan term" value={loanTermYears} onChange={setLoanTermYears} min={0.5} max={3} step={0.5} unit=" years" helpText="Cookstove loans typically 1-2 years" />
                        <SliderControl label="Annual interest rate (APR)" value={annualInterestRate} onChange={setAnnualInterestRate} min={15} max={50} step={1} unit="%" helpText="Rural MFI rates: 20-35% typical" />
                      </div>
                    )}
                    {paymentMethod === 'payg' && (
                      <div style={{ padding: '16px', background: 'white', border: '1px solid #e5e7eb' }}>
                        <SliderControl label="Lease-to-own term" value={paygTermYears} onChange={setPaygTermYears} min={1} max={4} step={0.5} unit=" years" helpText="Period until household owns asset" />
                        <SliderControl label="Total premium over cash price" value={paygPremiumPercent} onChange={setPaygPremiumPercent} min={30} max={100} step={5} unit="%" helpText="PAYG cookstoves typically 50-80% premium" />
                        <div style={{ fontSize: '13px', color: '#6b7280', marginTop: '8px' }}>No deposit required. Household owns asset after completing all payments.</div>
                      </div>
                    )}
                    {paymentMethod === 'upfront' && (
                      <div style={{ padding: '16px', background: 'white', border: '1px solid #e5e7eb', fontSize: '14px', color: '#4b5563' }}>
                        <p>Full cash payment upfront. Lowest total cost, but requires access to lump sum capital.</p>
                        <p style={{ marginTop: '10px', fontWeight: '500' }}>Best ROI, but highest access barrier for low-income households.</p>
                      </div>
                    )}
                    <div style={{ marginTop: '16px' }}>
                      <SliderControl label="Monthly household income" value={monthlyHouseholdIncome} onChange={setMonthlyHouseholdIncome} min={30} max={600} step={10} unit=" USD" helpText="Used for affordability analysis" />
                    </div>
                  </div>

                  <div>
                    <div style={{ fontSize: '14px', fontWeight: '600', marginBottom: '12px', color: B.hazyPlum }}>Financing summary by technology</div>
                    <div style={{ padding: '16px', background: 'white', border: '1px solid #e5e7eb', fontSize: '14px' }}>
                      {[
                        { label: 'ICS',   f: icsF,   total: icsF.totalCost },
                        { label: 'LPG',   f: lpgF,   total: lpgF.totalCost },
                        { label: 'Solar', f: solarF, total: solarF.totalCost },
                      ].map(({ label, f, total }, i) => (
                        <div key={label} style={{ marginBottom: i < 2 ? '14px' : 0, paddingTop: i > 0 ? '10px' : 0, borderTop: i > 0 ? '1px solid #e5e7eb' : 'none' }}>
                          <div style={{ fontWeight: '600', color: '#1e1e1e' }}>{label}</div>
                          <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>Total cost:</span><span style={{ fontWeight: '500' }}>${Math.round(total)}</span></div>
                          {paymentMethod !== 'upfront' && (
                            <>
                              <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>Monthly payment:</span><span style={{ fontWeight: '500' }}>${f.monthlyPayment.toFixed(2)}</span></div>
                              {paymentMethod === 'financing' && (
                                <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>Deposit:</span><span style={{ fontWeight: '500' }}>${Math.round(f.depositRequired)}</span></div>
                              )}
                            </>
                          )}
                        </div>
                      ))}
                    </div>

                    {/* Affordability alerts */}
                    {allIssues.length > 0 && (
                      <div style={{ marginTop: '14px' }}>
                        {allIssues.map((issue, idx) => (
                          <div key={idx} style={{ padding: '12px', background: issue.severity === 'error' ? '#fee2e2' : '#fef3c7', border: `2px solid ${issue.severity === 'error' ? '#fecaca' : '#fde68a'}`, marginBottom: '8px', fontSize: '13px', lineHeight: '1.5' }}>
                            <strong>{issue.severity === 'error' ? '⛔' : '⚠️'}</strong> {issue.message}
                          </div>
                        ))}
                      </div>
                    )}
                    {allIssues.length === 0 && (
                      <div style={{ marginTop: '14px', padding: '12px', background: '#dcfce7', border: `2px solid ${B.mint}`, fontSize: '13px', lineHeight: '1.5', color: B.clover }}>
                        <strong>✓ Affordability check passed:</strong> {paymentMethod === 'upfront' ? 'Upfront costs are within sustainable range relative to household income.' : 'All monthly payments are within sustainable range relative to household income.'}
                      </div>
                    )}
                  </div>
                </div>
              </div>

              {/* Baseline context */}
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px', marginBottom: '20px' }}>
                <div style={{ padding: '18px', background: '#f9fafb' }}>
                  <h3 style={{ fontSize: '16px', fontWeight: '600', marginBottom: '14px', color: '#1e1e1e' }}>Baseline context</h3>
                  <SliderControl label="Annual baseline fuel cost" value={baselineFuelCost} onChange={setBaselineFuelCost} min={0} max={300} step={5} unit=" USD/yr" helpText="Traditional fuels (wood, charcoal) may be gathered free, purchased, or both" />
                  <SliderControl label="Daily fuel collection time" value={baselineFuelCollection} onChange={setBaselineFuelCollection} min={0} max={5} step={0.1} unit=" hrs" helpText="Time women spend gathering firewood/fuel daily" />
                  <SliderControl label="Daily cooking time" value={baselineCookingTime} onChange={setBaselineCookingTime} min={2} max={10} step={0.1} unit=" hrs" helpText="Includes meal prep and tending traditional stove" />
                </div>
                <div style={{ padding: '18px', background: '#f9fafb' }}>
                  <h3 style={{ fontSize: '16px', fontWeight: '600', marginBottom: '14px', color: '#1e1e1e' }}>Time value and adoption</h3>
                  <SliderControl label="Wage rate" value={wageRate} onChange={setWageRate} min={0.1} max={2} step={0.01} unit=" USD/hr" helpText="Based on local agricultural wage rates" />
                  <SliderControl label="Time reallocated to paid work" value={timeReallocationPct} onChange={setTimeReallocationPct} min={0} max={100} step={5} unit="%" helpText="Portion of time saved that generates income" />
                  <SliderControl label="Stove stacking (traditional use)" value={stacking} onChange={setStacking} min={0} max={100} step={5} unit="%" helpText="Households often continue using traditional stoves alongside modern ones" />
                </div>
              </div>

              {/* Time saved — light blue */}
              <div style={{ padding: '16px', background: '#eff6ff', borderLeft: '4px solid #4A334E', marginBottom: '20px' }}>
                <h3 style={{ fontSize: '16px', fontWeight: '600', marginBottom: '12px', color: '#1e1e1e' }}>Time saved by women (per year, at current stacking level)</h3>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '20px', fontSize: '14px' }}>
                  {[
                    { key: 'ics', hours: icsHours, label: 'ICS' },
                    { key: 'lpg', hours: lpgHours, label: 'LPG' },
                    { key: 'solar', hours: solarHours, label: 'Solar' },
                  ].map(({ key, hours, label }) => (
                    <div key={key}>
                      <div style={{ fontWeight: '600', marginBottom: '4px' }}>{label}: {Math.round(hours)} hours/year</div>
                      <div style={{ color: '#4b5563', fontSize: '13px' }}>Collection: -{(technologies[key].fuelCollectionReduction * 100).toFixed(0)}% | Cooking: -{(technologies[key].cookingTimeReduction * 100).toFixed(0)}%</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Outcome cards */}
              <div style={{ marginBottom: '20px' }}>
                <h2 style={{ fontSize: '18px', fontWeight: '600', marginBottom: '14px', color: '#1e1e1e' }}>Financial comparison: {getLabel("ICS")} | {getLabel("LPG")} | {getLabel("Solar")}</h2>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '18px' }}>
                  <OutcomeCard tech={technologies.ics}   techKey="ics"   financing={icsF}   fuelSavings={icsSav}   timeValue={icsTime}   totalHours={icsHours}   capital={icsCapital}   netBenefit={icsNet}   roi={icsROI}   payback={icsPayback}   verdict={icsV} />
                  <OutcomeCard tech={technologies.lpg}   techKey="lpg"   financing={lpgF}   fuelSavings={lpgSav}   timeValue={lpgTime}   totalHours={lpgHours}   capital={lpgCapital}   netBenefit={lpgNet}   roi={lpgROI}   payback={lpgPayback}   verdict={lpgV} />
                  <OutcomeCard tech={technologies.solar} techKey="solar" financing={solarF} fuelSavings={solarSav} timeValue={solarTime} totalHours={solarHours} capital={solarCapital} netBenefit={solarNet} roi={solarROI} payback={solarPayback} verdict={solarV} />
                </div>
              </div>

              {/* Summary boxes — sharp corners */}
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px', fontSize: '14px' }}>
                <div style={{ padding: '16px', background: '#eff6ff', border: '1px solid #bfdbfe' }}>
                  <h3 style={{ fontWeight: '600', marginBottom: '10px', color: '#1e1e1e' }}>Baseline conditions</h3>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '6px', color: '#374151' }}>
                    <div><strong>Primary fuel:</strong> Biomass (wood, charcoal), traditional 3-stone fire</div>
                    <div><strong>PM2.5 exposure:</strong> 695 μg/m³ (hazardous level, 139x WHO guidelines)</div>
                    <div><strong>Daily time burden:</strong> {baselineFuelCollection.toFixed(1)} hrs collection + {baselineCookingTime.toFixed(1)} hrs cooking</div>
                    <div><strong>Annual fuel expenditure:</strong> ${baselineFuelCost}</div>
                    <div><strong>Monthly household income:</strong> ${monthlyHouseholdIncome}</div>
                  </div>
                </div>
                <div style={{ padding: '16px', background: '#f0fdf4', border: '1px solid #bbf7d0' }}>
                  <h3 style={{ fontWeight: '600', marginBottom: '10px', color: '#1e1e1e' }}>Health impact (full adoption, no stacking)</h3>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '12px', color: '#374151' }}>
                    {[{ label: 'ICS', key: 'ics' }, { label: 'LPG', key: 'lpg' }, { label: 'Solar', key: 'solar' }].map(({ label, key }) => (
                      <div key={key}>
                        <div style={{ fontWeight: '600' }}>{label}</div>
                        <div>PM2.5: -{(technologies[key].pm25Reduction * 100).toFixed(0)}%</div>
                        <div>DALYs: {technologies[key].dalys}/yr</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* Model notes — sharp corners */}
              <div style={{ marginTop: '20px', padding: '16px', background: '#f3f4f6', fontSize: '13px', color: '#6b7280', lineHeight: '1.6' }}>
                <strong style={{ color: '#374151' }}>Model assumptions:</strong> Equipment lifespans are ICS: 5 years, LPG: 10 years, Solar: 7 years. Financing terms based on rural MFI and PAYG market data from East Africa. Time value only realized when time is reallocated to paid work. Stove stacking reduces all benefits proportionally. LPG economics depend heavily on local fuel prices and supply chain reliability.
              </div>

              {/* Footer */}
              <div style={{ marginTop: '24px', paddingTop: '16px', borderTop: '1px solid #e5e7eb', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div style={{ display: 'flex', gap: '20px', alignItems: 'center' }}>
                  <a href="https://caribou.global" target="_blank" rel="noopener noreferrer">
                    <img src="Caribou_Logo_Primary_Black.png" alt="Caribou" style={{ height: '20px', opacity: 0.5 }} />
                  </a>
                  <a href="https://shellfoundation.org" target="_blank" rel="noopener noreferrer">
                    <img src="Caribou Logos/Shell_Foundation_Logo.jpg" alt="Shell Foundation" style={{ height: '20px', opacity: 0.7 }} />
                  </a>
                  <a href="https://www.gov.uk/government/organisations/foreign-commonwealth-development-office" target="_blank" rel="noopener noreferrer">
                    <img src="/Caribou Logos/UKaid.png" alt="UKaid" style={{ height: '20px', opacity: 0.7 }} />
                  </a>
                </div>
                <div style={{ fontSize: '12px', color: '#9ca3af' }}>
                  <span>© 2026 Caribou. All rights reserved.</span>
                  <span style={{ margin: '0 8px' }}>·</span>
                  <a href="https://caribou.global/contact/" target="_blank" rel="noopener noreferrer" style={{ color: '#FF5533', textDecoration: 'none' }}>Contact us</a>
                </div>
              </div>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StoveStackingWidget />);
    </script>
</body>
</html>
